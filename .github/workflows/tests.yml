# Runs the structure checks and the app's self-check on every push and pull request.
# A red ✗ on a commit means something is broken on the live site (main deploys straight to GitHub Pages).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (Chromium only)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Run tests
        run: node tests/run-tests.js
