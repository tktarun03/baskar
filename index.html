<style>
/* Base reset (matches the Claude artifact frame) */
:root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@supports (height: 100dvh) { html { height: 100dvh; } }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }

</style>
<!-- Every app file carries ?v=<version> so phones fetch the new copy after a release. Change them all together (see .claude/skills/baskar-release). -->
<link rel="stylesheet" href="css/app.css?v=2.0">

<body>
<div id="splash" class="splash" role="status" aria-label="Loading" data-noi18n>
  <div class="splash-in">
    <span class="splash-mark" id="splash-mark"><svg width="84" height="84" viewBox="0 0 100 100" aria-hidden="true"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="50" cy="50" r="41"/><path d="M34 45q5-6 10 0M56 45q5-6 10 0"/><path d="M38 57q12 11 24 0"/></g><circle cx="50" cy="50" r="34" stroke="currentColor" stroke-width="1.3" stroke-dasharray="1.5 4" stroke-linecap="round" fill="none" opacity=".55"/></svg></span>
    <span class="splash-name" id="splash-name">BasKar</span>
    <span class="splash-bar"><i></i></span>
  </div>
</div>
<script>
/* Launch screen: paint this device's saved app name, logo and colour before the libraries load, and never stay stuck. */
(function () {
  var el = document.getElementById('splash');
  try {
    var b = JSON.parse(localStorage.getItem('bk_splash') || 'null');
    if (b) {
      if (b.name) document.getElementById('splash-name').textContent = String(b.name).slice(0, 32);
      if (/^#[0-9a-f]{6}$/i.test(b.accent || '')) el.style.setProperty('--accent', b.accent);
      var m = document.getElementById('splash-mark');
      if (/^data:image\/(png|jpeg|webp|svg\+xml);base64,/.test(b.logo || '')) { var im = new Image(); im.alt = ''; im.src = b.logo; m.innerHTML = ''; m.appendChild(im); }
      else if (b.mascot === false) { var l = document.createElement('span'); l.className = 'letter'; l.textContent = String(b.name || 'B').charAt(0).toUpperCase(); m.innerHTML = ''; m.appendChild(l); }
    }
  } catch (e) { }
  setTimeout(function () { el.classList.add('out'); }, 8000);
})();
</script>
<div id="app" class="app"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
