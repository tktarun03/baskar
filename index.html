<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F5F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BasKar">
<meta name="description" content="A daily budget that tells you what you can safely spend today.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Base reset (matches the Claude artifact frame) */
:root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@supports (height: 100dvh) { html { height: 100dvh; } }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>BasKar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
/* Layout: one quiet column (max 460px). No hero card: today's number sits open on the page in a thin display weight, hairline rules separate everything else. Ink + one brass accent. */
:root {
  --bg: #F4F5F6;
  --surface: #FFFFFF;
  --surface-2: #EEF0F2;
  --ink: #121316;
  --ink-2: #3A3D43;
  --muted: #696D75;
  --faint: #A6AAB1;
  --line: #E4E6E9;
  --line-strong: #CDD0D5;
  --accent: #876628;
  --accent-soft: #F2ECDF;
  --on-ink: #FFFFFF;
  --good: #1F7A50;
  --bad: #B4432E;
  --warn: #9A5F00;
  --good-soft: #E6F2EB;
  --bad-soft: #F8E8E4;
  --warn-soft: #F6EFDF;
  --notif-bg: #121316;
  --notif-ink: #FFFFFF;
  --notif-muted: #A9ACB3;
  --paper: #FDFCF9;
  --paper-ink: #17171A;
  --paper-muted: #6C6A64;
  --stamp-bad: #B4432E;
  --stamp-good: #1F7A50;
  --scrim: rgba(10, 11, 13, 0.38);
  --shadow: 0 24px 60px rgba(18, 19, 22, 0.14);
  --f-display: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --f-body: 'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0B; --surface: #121214; --surface-2: #1B1C1F; --ink: #ECECEE; --ink-2: #C4C5C9; --muted: #8D9098; --faint: #5A5D63; --line: #222326; --line-strong: #34363B;
    --accent: #D4B47C; --accent-soft: #2A2418; --on-ink: #0A0A0B;
    --good: #57C08E; --bad: #F07A63; --warn: #E2AE55; --good-soft: #13261C; --bad-soft: #2C1612; --warn-soft: #2A2112;
    --notif-bg: #1B1C1F; --notif-ink: #ECECEE; --notif-muted: #9A9DA4;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0B; --surface: #121214; --surface-2: #1B1C1F; --ink: #ECECEE; --ink-2: #C4C5C9; --muted: #8D9098; --faint: #5A5D63; --line: #222326; --line-strong: #34363B;
  --accent: #D4B47C; --accent-soft: #2A2418; --on-ink: #0A0A0B;
  --good: #57C08E; --bad: #F07A63; --warn: #E2AE55; --good-soft: #13261C; --bad-soft: #2C1612; --warn-soft: #2A2112;
  --notif-bg: #1B1C1F; --notif-ink: #ECECEE; --notif-muted: #9A9DA4;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; font-weight: 400; line-height: 1.5; letter-spacing: -0.003em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 300; letter-spacing: -0.025em; text-wrap: balance; }
strong { font-weight: 500; }
p { margin: 0; }

/* App shell (mobile first): a full-height column. The content scrolls inside .scroller; the tab bar is the last flex child, so it always sits at the bottom of the screen. */
.app { --colmax: 100%; position: relative; height: 100%; display: flex; flex-direction: column; }
.scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.col { width: 100%; max-width: var(--colmax); margin: 0 auto; min-height: 100%; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 20px 100px; display: flex; flex-direction: column; gap: 16px; }
.app.is-auth .col { padding-block: 20px 28px; gap: 22px; }
.foot { margin-top: auto; padding-top: 8px; }
.logo { display: block; height: 28px; width: auto; max-width: 160px; object-fit: contain; }
.logo.sm { height: 24px; max-width: 96px; }
.head-mark { display: none; align-items: center; }
.logo-box { min-height: 84px; border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--surface); display: flex; align-items: center; justify-content: center; padding: 14px; }
.logo-box img { max-height: 52px; max-width: 70%; object-fit: contain; }
.color-row { display: flex; align-items: center; gap: 12px; }
input[type=color] { width: 56px; height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 4px; background: var(--surface); cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sr-only:focus-visible + label { outline: 1.5px solid var(--ink); outline-offset: 3px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.srow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow input[type=checkbox] { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); cursor: pointer; }
.srow label { cursor: pointer; }
.srow-sub { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.srow-sub .input { min-height: 44px; }
.srow-sub .full { grid-column: 1 / -1; }
.remark { display: block; margin-top: 2px; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn.spin svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.head-actions { display: flex; gap: 8px; flex-shrink: 0; }
.mono { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
details.card summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid2 .input { min-height: 46px; }
.sheet-wrap.still, .sheet-wrap.still .sheet { animation: none; }

.num { font-family: var(--f-display); font-variant-numeric: tabular-nums lining-nums; font-weight: 200; letter-spacing: -0.04em; }
.big { font-size: clamp(44px, 15vw, 64px); line-height: 0.95; }
.xl { font-size: 44px; line-height: 1; }
.md { font-size: 26px; line-height: 1.1; font-weight: 300; letter-spacing: -0.03em; }
.eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
.fine { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.muted { color: var(--muted); }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.wrap { flex-wrap: wrap; gap: 8px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-xs { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pad { padding: 0 2px; }
.h2 { font-size: 30px; line-height: 1.08; }
.h3 { font-size: 18px; line-height: 1.25; font-weight: 400; letter-spacing: -0.015em; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card.tight { padding: 4px 18px; gap: 0; }
.card.mini { padding: 16px 18px; gap: 4px; }

.btn { appearance: none; border: 0; border-radius: 999px; min-height: 52px; padding: 0 22px; font-weight: 500; font-size: 15px; letter-spacing: 0; cursor: pointer; background: var(--ink); color: var(--on-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.15s ease, transform 0.12s ease; text-align: center; }
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.985); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--ink); }
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 14px; }
.btn.danger-text { color: var(--bad); border-color: var(--line); }
.icon-btn { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > label, .label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.input { width: 100%; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; font-weight: 400; color: var(--ink); }
.input:focus { border-color: var(--ink); outline: none; }
/* iOS Safari gives date/time inputs a fixed minimum width that ignores width:100%, which pushed sheets sideways. */
input[type=datetime-local].input, input[type=date].input { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; line-height: 48px; }
input[type=datetime-local]::-webkit-date-and-time-value, input[type=date]::-webkit-date-and-time-value { text-align: left; }
select.input { min-width: 0; max-width: 100%; text-overflow: ellipsis; }
textarea.input { padding: 12px 14px; min-height: 110px; font-family: var(--f-mono); font-size: 16px; resize: vertical; }
.money-input { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line-strong); padding-bottom: 6px; }
.money-input:focus-within { border-color: var(--ink); }
.money-input input { flex: 1; width: 100%; min-width: 0; border: 0; background: transparent; font-family: var(--f-display); font-size: 46px; font-weight: 200; letter-spacing: -0.04em; padding: 2px 0; outline: none; font-variant-numeric: tabular-nums; }
.money-input .cur { font-family: var(--f-display); font-size: 18px; font-weight: 300; color: var(--muted); white-space: nowrap; }
.money-input.sm input { font-size: 30px; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
.error { font-size: 13.5px; font-weight: 500; color: var(--bad); }
.notice { padding: 14px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: 13.5px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 400; font-size: 14px; cursor: pointer; color: var(--ink); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.chip .sub { color: var(--muted); font-size: 13px; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); gap: 2px; }
.seg.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg button { min-height: 44px; border: 0; border-radius: 999px; background: transparent; font-weight: 400; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 500; }
.switch { width: 46px; height: 28px; flex-shrink: 0; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; cursor: pointer; transition: background 0.15s; }
.switch::after { content: ""; position: absolute; inset: -8px; }
.switch span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: transform 0.18s ease; }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"] span { transform: translateX(18px); }

.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 300; font-size: 21px; letter-spacing: -0.03em; color: var(--ink); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.avatar { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 50%; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); font-family: var(--f-display); font-weight: 300; letter-spacing: 0.02em; }
.avatar-btn { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; }

.intro { display: flex; flex-direction: column; gap: 14px; padding: 12px 0 0; }
.display { font-size: clamp(36px, 11vw, 56px); line-height: 1.02; font-weight: 200; letter-spacing: -0.045em; }
.lede { font-size: 16px; line-height: 1.6; color: var(--muted); max-width: 38ch; }
.plist { display: flex; flex-direction: column; }
.prow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; color: var(--ink); }
.prow:first-child { border-top: 0; }
.prow strong, .txn strong, .evt strong { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.steps li { height: 2px; border-radius: 999px; background: var(--line); }
.steps li.on { background: var(--ink); }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 104px 44px; gap: 8px; align-items: center; }
.frow .input { min-height: 46px; font-size: 16px; }
.frow2 { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); align-items: center; }
.frow2 .sub { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.frow2 .input { min-height: 46px; font-size: 16px; }
.preview { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 22px 2px; display: flex; flex-direction: column; gap: 6px; }
.naive { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
.naive s { color: var(--ink); text-decoration-color: var(--bad); text-decoration-thickness: 1px; }

.app-head { display: flex; align-items: center; gap: 12px; }
.app-head .h2 { font-size: clamp(21px, 6vw, 28px); }
.head-badge { display: none; }

.hero { position: relative; display: flex; flex-direction: column; gap: 18px; padding: 10px 2px 6px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hero .is-over { color: var(--bad); }
.hero-foot { font-size: 14px; color: var(--ink-2); }
.bar { position: relative; display: flex; gap: 2px; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar span { height: 100%; transition: width 0.5s ease; }
.bar .marker { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.bubble { padding-top: 16px; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.5; color: var(--ink-2); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.bubble .mood { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.mascot { flex-shrink: 0; color: var(--ink-2); }
.hero .mascot { animation: bob 4s ease-in-out infinite; }
.ex { align-self: flex-start; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; }
.wcol { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.wbar-box { height: 64px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.wbar { width: 100%; max-width: 18px; border-radius: 3px; }
.wamt { font-size: 10px; color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; font-variant-numeric: tabular-nums; }
.wday { font-size: 12px; color: var(--muted); }
.wday.today { color: var(--ink); font-weight: 500; }

.streak { display: flex; align-items: center; gap: 16px; }
.streak-title { font-family: var(--f-display); font-size: 20px; font-weight: 300; letter-spacing: -0.02em; }
.flame { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--line-strong); color: var(--accent); }
.flame.cold { color: var(--faint); }
.alert { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border: 1px solid transparent; border-radius: 16px; background: var(--bad-soft); color: var(--ink); text-align: left; }
.alert.warn { background: var(--warn-soft); }
.alert.info { background: var(--surface); border-color: var(--line); cursor: pointer; }
.alert strong { font-size: 15px; font-weight: 500; }

.txn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; color: var(--ink); }
.txn:first-of-type { border-top: 0; }
.tile { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--line); color: var(--c); }
.amt { font-family: var(--f-display); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt.pos { color: var(--good); }
.amt.save { color: var(--accent); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 0 8px; }

.filters { display: flex; flex-direction: column; gap: 10px; }
.search { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.search:focus-within { border-color: var(--ink); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 16px; color: var(--ink); }

.prog { height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; }
.prog span { display: block; height: 100%; border-radius: 999px; }
.chart-box { position: relative; height: 190px; }
.donut-wrap { position: relative; height: 200px; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dash { width: 16px; border-top: 1px dashed var(--ink); display: inline-block; }
.crow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.cbar { height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 8px; }
.cbar span { display: block; height: 100%; border-radius: 999px; background: var(--c); }
.leak { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
.leak .eyebrow { color: var(--accent); }

      if (e.type !== 'change') return;
      var it = S.sheet.items[+el.dataset.smscat]; it.cat = el.value;
      if (it.cat === 'food') { if (!it.meal) it.meal = mealFor(it.ts); } else it.meal = '';
      renderSheet(); return;
    }
    if (el.dataset && el.dataset.fx !== undefined && S.sheet && S.sheet.items) {
      S.sheet.fx = S.sheet.fx || {}; S.sheet.fx[el.dataset.fx] = el.value;
      /* Update the rows and button in place: re-rendering the whole sheet here would swallow a tap on Add. */
      var list = $('#sms-list'); if (list) list.innerHTML = brandify(S.sheet.items.map(smsRow).join(''), true);
      var ab = $('#sms-add'), an = smsAddable(S.sheet); if (ab) { ab.textContent = 'Add ' + plural(an, 'transaction'); ab.disabled = !an; }
      return;
    }
    if (el.dataset && el.dataset.smsmeal !== undefined && S.sheet && S.sheet.items) { S.sheet.items[+el.dataset.smsmeal].meal = el.value; return; }
    if (el.dataset && el.dataset.smsnote !== undefined && S.sheet && S.sheet.items) { S.sheet.items[+el.dataset.smsnote].note = el.value; return; }
    if (el.dataset && S.sheet && S.sheet.type === 'csv' && e.type === 'change') {
      if (el.dataset.csvmap !== undefined) { S.sheet.map[el.dataset.csvmap] = el.value; renderSheet(); return; }
      if (el.dataset.csvsign !== undefined) { S.sheet.sign = el.value; renderSheet(); return; }
      if (el.dataset.csvwallet !== undefined) { S.sheet.wallet = el.value; renderSheet(); return; }
    }
    if (el.dataset && el.dataset.b !== undefined && S.brandDraft) {
      S.brandDraft[el.dataset.b] = el.value;
      if (el.dataset.b === 'accent' && HEX_RE.test(el.value)) {
        applyBrand(S.brandDraft);
        var ch = $('#b-contrast'); if (ch) ch.textContent = contrast(el.value, '#FFFFFF') < 4.5 ? 'This colour is light for text on white. A darker shade will read better.' : 'Used for savings, streaks and today’s bar. Dark mode gets a lighter version automatically.';
      }
      var bp = $('#b-preview'); if (bp) bp.innerHTML = brandPreview(S.brandDraft);
      return;
    }
    if (el.dataset && el.dataset.d !== undefined && S.draft) {
      setPath(S.draft, el.dataset.d, el.value);
      if (el.dataset.d === 'currency') { var s = $('#cur-sym'); if (s) s.textContent = curSymbol(el.value); }
      var pv = $('#create-preview'); if (pv) pv.innerHTML = previewHtml(S.draft.income, S.draft.fixed, S.draft.cycleStart, S.draft.currency);
      return;
    }
    if (el.dataset && el.dataset.pl !== undefined && S.plan) {
      setPath(S.plan, el.dataset.pl, el.value);
      if (el.dataset.pl === 'currency') { var s2 = $('#pl-sym'); if (s2) s2.textContent = curSymbol(el.value); }
      var pp = $('#plan-preview'); if (pp) pp.innerHTML = previewHtml(S.plan.income, S.plan.fixed, S.plan.cycleStart, S.plan.currency);
      return;
    }
    if (el.id === 'f-q') { S.filter.q = el.value; S.actLimit = 60; $('#act-list').innerHTML = activityList(); return; }
    if ((el.id === 'f-acct' || el.id === 'f-cat') && e.type === 'change') { S.filter[el.id === 'f-acct' ? 'acct' : 'cat'] = el.value; S.actLimit = 60; $('#act-list').innerHTML = activityList(); }
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', onField);
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === 'signin-form') signIn(S.auth.pick, $('#si-pw').value);
    else if (id === 'create-form') createStep();
    else if (id === 'txn-form') saveTxn();
    else if (id === 'wallet-form') saveWallet();
    else if (id === 'plan-form') savePlan();
    else if (id === 'goal-form') saveGoal();
    else if (id === 'contrib-form') saveContrib();
    else if (id === 'brand-form') saveBrand();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheet(); });
  document.addEventListener('scroll', function (e) { if (e.target && e.target.classList && e.target.classList.contains('sheet-body')) sheetShadow(); }, true);
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (S.tab === 'insights') drawCharts(); }); } catch (e) { }
  try {
    new MutationObserver(function () {
      if (!applyingTheme) {
        hostTheme = document.documentElement.getAttribute('data-theme');
        var t = S.p && S.p.settings ? S.p.settings.theme : 'system';
        if (t === 'light' || t === 'dark') applyTheme();
      }
      if (S.tab === 'insights') drawCharts();
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) { }

  /* ---------------- Boot ---------------- */
  Store.init();
  BR = cleanBrand(Store.get('bk_brand'));
  applyBrand();
  S.index = Store.get('bk_idx') || { v: 1, profiles: [] };
  if (!Array.isArray(S.index.profiles)) S.index.profiles = [];
  var sess = Store.get('bk_sess');
  if (sess && sess.pid && meta(sess.pid)) loadProfile(sess.pid);
  renderAll();
  try { if (sessionStorage.getItem('bk_refreshed')) { sessionStorage.removeItem('bk_refreshed'); setTimeout(function () { toast('Refreshed', 'Version ' + APP_VERSION + '. Your data is still here.'); }, 300); } } catch (e) { }
  /* Hook for tests/run-tests.js and the Settings self-check. */
  window.BasKarTest = { run: runSelfTest, parseSms: function (t) { return parseSms(t, {}, {}); }, parseQuick: function (t) { return parseQuick(t, {}); } };
  /* After an update, say so once and offer the version history. */
  try {
    var seenV = localStorage.getItem('bk_seen_v');
    if (seenV !== RELEASES[0].v) {
      localStorage.setItem('bk_seen_v', RELEASES[0].v);
      if (seenV) setTimeout(function () { toast('Updated to version ' + RELEASES[0].v, RELEASES[0].notes[0] + '.', { action: { label: 'What’s new', fn: function () { S.sheet = { type: 'history' }; renderSheet(); } } }); }, 400);
    }
  } catch (e) { }
})();
</script>

<style>@supports (height: 100dvh) { html { height: 100dvh; } }</style>
</body>
